<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>سبد خرید | NavidTowel</title>
<link rel="stylesheet" href="style.css">
<style>
/* =========================
   صفحه سبد خرید
   ========================= */
.cart-page {
    padding: 140px 0 150px;
    min-height: 100vh;
}
.cart-page-title {
    text-align: center;
    margin-bottom: 35px;
}
.cart-page-title h1 {
    font-size: 32px;
    margin: 0 0 8px;
}
.cart-page-title p {
    color: #777;
    margin: 0;
}
/* =========================
   محتوای اصلی
   ========================= */
.cart-layout {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 25px;
    align-items: start;
}
/* =========================
   لیست محصولات
   ========================= */
.cart-products {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.cart-product {
    background: white;
    border-radius: 18px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}
.cart-product-image {
    width: 105px;
    height: 105px;
    flex-shrink: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #f4f4f0;
}
.cart-product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.cart-product-info {
    flex: 1;
    min-width: 0;
}
.cart-product-info h3 {
    margin: 0 0 7px;
    font-size: 17px;
}
.cart-product-price {
    color: #34452f;
    font-weight: bold;
    font-size: 14px;
}
.cart-product-old-price {
    color: #999;
    text-decoration: line-through;
    font-size: 12px;
    margin-right: 8px;
}
.cart-product-controls {
    display: flex;
    align-items: center;
    gap: 7px;
}
.qty-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 9px;
    background: #f0f3ec;
    color: #34452f;
    font-size: 18px;
    cursor: pointer;
}
.qty-number {
    min-width: 25px;
    text-align: center;
    font-weight: bold;
}
.cart-product-total {
    min-width: 125px;
    text-align: center;
    font-weight: bold;
    color: #34452f;
}
.remove-product {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 9px;
    background: #f8eeee;
    color: #b34b4b;
    cursor: pointer;
    font-size: 17px;
}
/* =========================
   خلاصه سفارش
   ========================= */
.order-summary {
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    position: sticky;
    top: 110px;
}
.order-summary h2 {
    margin: 0 0 20px;
    font-size: 19px;
}
.summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    color: #666;
    font-size: 14px;
}
.summary-row strong {
    color: #333;
}
.summary-discount {
    color: #4e7945 !important;
}
.summary-line {
    height: 1px;
    background: #eee;
    margin: 18px 0;
}
.summary-final {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.summary-final span {
    font-weight: bold;
}
.summary-final strong {
    color: #34452f;
    font-size: 20px;
}
.checkout-btn {
    width: 100%;
    border: none;
    background: #34452f;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    margin-top: 20px;
}
.checkout-btn:active {
    transform: scale(0.98);
}
/* =========================
   نوار پایین
   ========================= */
.cart-bottom-bar {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    width: min(900px, calc(100% - 30px));
    background: rgba(255,255,255,0.97);
    border: 1px solid #e3e3e3;
    border-radius: 17px;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.14);
    z-index: 99999;
}
.bottom-cart-info {
    display: flex;
    align-items: center;
    gap: 10px;
}
.bottom-cart-icon {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: #f0f3ec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}
.bottom-cart-text strong {
    display: block;
    font-size: 13px;
}
.bottom-cart-text span {
    display: block;
    color: #777;
    font-size: 11px;
    margin-top: 3px;
}
.bottom-cart-details {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    gap: 30px;
}
.bottom-detail {
    text-align: center;
}
.bottom-detail span {
    display: block;
    color: #888;
    font-size: 10px;
}
.bottom-detail strong {
    display: block;
    margin-top: 3px;
    font-size: 13px;
}
.bottom-discount {
    color: #4e7945;
}
.bottom-final {
    color: #34452f;
}
.bottom-checkout {
    border: none;
    background: #34452f;
    color: white;
    font-family: inherit;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
}
/* =========================
   سبد خالی
   ========================= */
.empty-cart-page {
    background: white;
    border-radius: 20px;
    padding: 70px 20px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.05);
}
.empty-cart-icon {
    font-size: 50px;
    margin-bottom: 15px;
}
.empty-cart-page h2 {
    margin: 0 0 8px;
}
.empty-cart-page p {
    color: #777;
    margin-bottom: 22px;
}
.back-shop-btn {
    display: inline-block;
    background: #34452f;
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 11px;
}
/* =========================
   موبایل
   ========================= */
@media (max-width: 850px) {
    .cart-layout {
        grid-template-columns: 1fr;
    }
    .order-summary {
        display: none;
    }
    .cart-product {
        padding: 11px;
        gap: 11px;
        flex-wrap: wrap;
    }
    .cart-product-image {
        width: 75px;
        height: 75px;
    }
    .cart-product-info h3 {
        font-size: 14px;
    }
    .cart-product-price {
        font-size: 12px;
    }
    .cart-product-controls {
        order: 4;
        width: 100%;
        justify-content: flex-start;
    }
    .cart-product-total {
        margin-right: auto;
        min-width: auto;
        font-size: 12px;
    }
    .cart-bottom-bar {
        bottom: 9px;
        width: calc(100% - 18px);
        padding: 9px;
        gap: 8px;
    }
    .bottom-cart-icon {
        width: 34px;
        height: 34px;
        font-size: 16px;
    }
    .bottom-cart-text strong {
        font-size: 11px;
    }
    .bottom-cart-text span {
        font-size: 9px;
    }
    .bottom-cart-details {
        gap: 8px;
    }
    .bottom-detail span {
        font-size: 8px;
    }
    .bottom-detail strong {
        font-size: 10px;
    }
    .bottom-checkout {
        padding: 9px 10px;
        font-size: 10px;
    }
}
/* موبایل خیلی کوچک */
@media (max-width: 500px) {
    .cart-page {
        padding-top: 120px;
        padding-bottom: 110px;
    }
    .cart-page-title h1 {
        font-size: 25px;
    }
    .bottom-cart-details {
        display: none;
    }
    .bottom-cart-info {
        flex: 1;
    }
    .bottom-checkout {
        padding: 10px 15px;
        font-size: 11px;
    }
}
</style>
</head>
<body>
<!-- =========================
     هدر
     ========================= -->
<header class="header">
<div class="container header-inner">
    <a href="index.html" class="logo">
        Navid<span>Towel</span>
    </a>
    <nav class="nav">
        <a href="index.html#home">
            خانه
        </a>
        <a href="shop.html">
            فروشگاه
        </a>
        <a href="index.html#categories">
            دسته‌بندی‌ها
        </a>
        <a href="index.html#about">
            درباره ما
        </a>
        <a href="index.html#contact">
            تماس با ما
        </a>
    </nav>
    <div class="header-actions">
        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← بازگشت
        </button>
        <a
            href="shop.html"
            class="all-products-btn"
        >
            🛍️ همه محصولات
        </a>
        <button class="cart-btn">
            🛒 سبد خرید
            <span id="headerCartCount">
                0
            </span>
        </button>
    </div>
</div>
</header>
<!-- =========================
     صفحه
     ========================= -->
<main class="cart-page">
<div class="container">
    <div class="cart-page-title">
        <h1>
            سبد خرید
        </h1>
        <p>
            محصولات انتخاب‌شده شما
        </p>
    </div>
    <div id="cartContent"></div>
</div>
</main>
<!-- =========================
     نوار پایین
     ========================= -->
<div
    class="cart-bottom-bar"
    id="cartBottomBar"
>
    <div class="bottom-cart-info">
        <div class="bottom-cart-icon">
            🛒
        </div>
        <div class="bottom-cart-text">
            <strong>
                سبد خرید
            </strong>
            <span>
                <span id="bottomQuantity">0</span>
                کالا
            </span>
        </div>
    </div>
    <div class="bottom-cart-details">
        <div class="bottom-detail">
            <span>
                مبلغ کالاها
            </span>
            <strong id="bottomSubtotal">
                0 تومان
            </strong>
        </div>
        <div class="bottom-detail">
            <span>
                تخفیف
            </span>
            <strong
                class="bottom-discount"
                id="bottomDiscount"
            >
                0 تومان
            </strong>
        </div>
        <div class="bottom-detail">
            <span>
                مبلغ نهایی
            </span>
            <strong
                class="bottom-final"
                id="bottomFinal"
            >
                0 تومان
            </strong>
        </div>
    </div>
    <button
        class="bottom-checkout"
        id="bottomCheckout"
    >
        ادامه سفارش
    </button>
</div>
<script src="products.js"></script>
<script>
/* =========================
   سبد خرید
   ========================= */
let cart =
    JSON.parse(
        localStorage.getItem("navidTowelCart")
    ) || [];
/* =========================
   فرمت قیمت
   ========================= */
function price(value) {
    return Number(value)
        .toLocaleString("en-US")
        + " تومان";
}
/* =========================
   ذخیره
   ========================= */
function saveCart() {
    localStorage.setItem(
        "navidTowelCart",
        JSON.stringify(cart)
    );
}
/* =========================
   ساخت سبد
   ========================= */
function renderCart() {
    const content =
        document.getElementById("cartContent");
    if (!cart.length) {
        content.innerHTML = `
            <div class="empty-cart-page">
                <div class="empty-cart-icon">
                    🛒
                </div>
                <h2>
                    سبد خرید شما خالی است
                </h2>
                <p>
                    هنوز محصولی به سبد خرید اضافه نکرده‌اید.
                </p>
                <a
                    href="shop.html"
                    class="back-shop-btn"
                >
                    رفتن به فروشگاه
                </a>
            </div>
        `;
        updateSummary();
        return;
    }
    content.innerHTML = `
        <div class="cart-layout">
            <div class="cart-products">
                ${
                    cart.map(item => {
                        const product =
                            products.find(
                                p => p.id === item.id
                            );
                        if (!product) return "";
                        return `
                            <div class="cart-product">
                                <div class="cart-product-image">
                                    <img
                                        src="${product.image}"
                                        alt="${product.name}"
                                    >
                                </div>
                                <div class="cart-product-info">
                                    <h3>
                                        ${product.name}
                                    </h3>
                                    <div>
                                        <span class="cart-product-price">
                                            ${price(item.price)}
                                        </span>
                                        ${
                                            product.oldPrice &&
                                            product.oldPrice > item.price
                                            ?
                                            `
                                            <span class="cart-product-old-price">
                                                ${price(product.oldPrice)}
                                            </span>
                                            `
                                            :
                                            ""
                                        }
                                    </div>
                                </div>
                                <div class="cart-product-controls">
                                    <button
                                        class="qty-btn"
                                        onclick="
                                            changeQuantity(
                                                ${item.id},
                                                1
                                            )
                                        "
                                    >
                                        +
                                    </button>
                                    <span class="qty-number">
                                        ${item.quantity}
                                    </span>
                                    <button
                                        class="qty-btn"
                                        onclick="
                                            changeQuantity(
                                                ${item.id},
                                                -1
                                            )
                                        "
                                    >
                                        −
                                    </button>
                                </div>
                                <div class="cart-product-total">
                                    ${price(
                                        item.price *
                                        item.quantity
                                    )}
                                </div>
                                <button
                                    class="remove-product"
                                    onclick="
                                        removeProduct(
                                            ${item.id}
                                        )
                                    "
                                >
                                    ×
                                </button>
                            </div>
                        `;
                    }).join("")
                }
            </div>
            <div class="order-summary">
                <h2>
                    خلاصه سفارش
                </h2>
                <div class="summary-row">
                    <span>
                        مبلغ کالاها
                    </span>
                    <strong id="summarySubtotal">
                        0 تومان
                    </strong>
                </div>
                <div class="summary-row">
                    <span>
                        تخفیف
                    </span>
                    <strong
                        class="summary-discount"
                        id="summaryDiscount"
                    >
                        0 تومان
                    </strong>
                </div>
                <div class="summary-row">
                    <span>
                        ارسال
                    </span>
                    <strong>
                        محاسبه در مرحله بعد
                    </strong>
                </div>
                <div class="summary-line"></div>
                <div class="summary-final">
                    <span>
                        مبلغ قابل پرداخت
                    </span>
                    <strong id="summaryFinal">
                        0 تومان
                    </strong>
                </div>
                <button
                    class="checkout-btn"
                    onclick="goCheckout()"
                >
                    ادامه و ثبت سفارش
                </button>
            </div>
        </div>
    `;
    updateSummary();
}
/* =========================
   تغییر تعداد
   ========================= */
function changeQuantity(id, amount) {
    const item =
        cart.find(
            product => product.id === id
        );
    if (!item) return;
    item.quantity += amount;
    if (item.quantity <= 0) {
        cart =
            cart.filter(
                product => product.id !== id
            );
    }
    saveCart();
    renderCart();
}
/* =========================
   حذف محصول
   ========================= */
function removeProduct(id) {
    cart =
        cart.filter(
            product => product.id !== id
        );
    saveCart();
    renderCart();
}
/* =========================
   محاسبه قیمت‌ها
   ========================= */
function updateSummary() {
    let subtotal = 0;
    let discount = 0;
    let quantity = 0;
    cart.forEach(item => {
        const product =
            products.find(
                p => p.id === item.id
            );
        quantity += item.quantity;
        subtotal +=
            item.price *
            item.quantity;
        if (
            product &&
            product.oldPrice &&
            product.oldPrice > item.price
        ) {
            discount +=
                (
                    product.oldPrice -
                    item.price
                ) *
                item.quantity;
        }
    });
    const finalPrice =
        subtotal;
    const summarySubtotal =
        document.getElementById(
            "summarySubtotal"
        );
    const summaryDiscount =
        document.getElementById(
            "summaryDiscount"
        );
    const summaryFinal =
        document.getElementById(
            "summaryFinal"
        );
    const bottomSubtotal =
        document.getElementById(
            "bottomSubtotal"
        );
    const bottomDiscount =
        document.getElementById(
            "bottomDiscount"
        );
    const bottomFinal =
        document.getElementById(
            "bottomFinal"
        );
    const bottomQuantity =
        document.getElementById(
            "bottomQuantity"
        );
    const headerCartCount =
        document.getElementById(
            "headerCartCount"
        );
    if (summarySubtotal) {
        summarySubtotal.textContent =
            price(subtotal);
    }
    if (summaryDiscount) {
        summaryDiscount.textContent =
            price(discount);
    }
    if (summaryFinal) {
        summaryFinal.textContent =
            price(finalPrice);
    }
    if (bottomSubtotal) {
        bottomSubtotal.textContent =
            price(subtotal);
    }
    if (bottomDiscount) {
        bottomDiscount.textContent =
            price(discount);
    }
    if (bottomFinal) {
        bottomFinal.textContent =
            price(finalPrice);
    }
    if (bottomQuantity) {
        bottomQuantity.textContent =
            quantity;
    }
    if (headerCartCount) {
        headerCartCount.textContent =
            quantity;
    }
}
/* =========================
   رفتن به مرحله سفارش
   ========================= */
function goCheckout() {
    if (!cart.length) return;
    alert(
        "صفحه تکمیل سفارش در مرحله بعدی فعال می‌شود."
    );
}
/* =========================
   شروع
   ========================= */
renderCart();
</script>
</body>
</html>
