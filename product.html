<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محصول | NavidTowel</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .product-page {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            color: #304d3b;
            text-decoration: none;
            font-weight: 700;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: center;
        }

        .product-image-box {
            background: #f3efe5;
            border-radius: 25px;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-box img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        .product-info h1 {
            font-size: 38px;
            margin-bottom: 15px;
            color: #263b2e;
        }

        .product-badge {
            display: inline-block;
            background: #304d3b;
            color: white;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .product-price {
            font-size: 30px;
            font-weight: 900;
            color: #304d3b;
            margin: 25px 0;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 17px;
            margin-right: 10px;
        }

        .product-description {
            line-height: 2;
            color: #666;
            margin-bottom: 25px;
        }

        .product-specs {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .spec-row span:first-child {
            color: #777;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .quantity-box button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            background: #eee8dc;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-box input {
            width: 60px;
            height: 40px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .add-product-btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            background: #304d3b;
            color: white;
            padding: 17px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .add-product-btn:hover {
            transform: translateY(-2px);
            opacity: .92;
        }

        .similar-products {
            margin-top: 80px;
        }

        .similar-products h2 {
            margin-bottom: 25px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .similar-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
            cursor: pointer;
        }

        .similar-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .similar-card-content {
            padding: 15px;
        }

        .similar-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .similar-price {
            color: #304d3b;
            font-weight: 800;
        }

        @media (max-width: 800px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-image-box {
                min-height: auto;
            }

            .product-image-box img {
                height: 380px;
            }

            .product-info h1 {
                font-size: 28px;
            }

            .similar-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .product-page {
                margin-top: 25px;
            }

            .product-image-box img {
                height: 330px;
            }

            .similar-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">NavidTowel</a>

        <nav>
            <a href="index.html">خانه</a>
            <a href="index.html#products">فروشگاه</a>
            <a href="index.html#categories">دسته‌بندی‌ها</a>
            <a href="index.html#about">درباره ما</a>
        </nav>

        <button onclick="window.location.href='index.html#products'">
            🛒 سبد خرید
        </button>
    </div>
</header>


<main class="product-page">

    <a href="index.html#products" class="back-btn">
        ← بازگشت به فروشگاه
    </a>

    <section class="product-detail">

        <div class="product-image-box">
            <img id="productImage" src="" alt="">
        </div>

        <div class="product-info">

            <span id="productBadge" class="product-badge"></span>

            <h1 id="productName">در حال بارگذاری...</h1>

            <div id="productPrice" class="product-price"></div>

            <p id="productDescription" class="product-description"></p>

            <div class="product-specs">

                <div class="spec-row">
                    <span>دسته‌بندی</span>
                    <strong id="productCategory"></strong>
                </div>

                <div class="spec-row">
                    <span>کیفیت</span>
                    <strong>درجه یک</strong>
                </div>

                <div class="spec-row">
                    <span>مناسب برای</span>
                    <strong id="productUse"></strong>
                </div>

            </div>

            <div class="quantity-box">

                <button onclick="changeQuantity(-1)">−</button>

                <input
                    id="quantity"
                    type="number"
                    value="1"
                    min="1"
                >

                <button onclick="changeQuantity(1)">+</button>

                <span>تعداد</span>

            </div>

            <button
                class="add-product-btn"
                onclick="addCurrentProduct()">
                افزودن به سبد خرید
            </button>

        </div>

    </section>


    <section class="similar-products">

        <h2>محصولات مشابه</h2>

        <div id="similarProducts" class="similar-grid"></div>

    </section>

</main>


<script src="products.js"></script>

<script>

let currentProduct = null;

function formatPrice(price) {
    return Number(price).toLocaleString("fa-IR") + " تومان";
}


function loadProduct() {

    const params = new URLSearchParams(window.location.search);

    const id = Number(params.get("id"));

    currentProduct = products.find(product => product.id === id);

    if (!currentProduct) {
        document.querySelector(".product-page").innerHTML = `
            <h2>محصول پیدا نشد</h2>
            <a href="index.html">بازگشت به فروشگاه</a>
        `;
        return;
    }


    document.title = currentProduct.name + " | NavidTowel";


    document.getElementById("productName").textContent =
        currentProduct.name;


    document.getElementById("productBadge").textContent =
        currentProduct.badge || "محصول";


    document.getElementById("productImage").src =
        currentProduct.image;


    document.getElementById("productImage").alt =
        currentProduct.name;


    let priceHTML = formatPrice(currentProduct.price);

    if (currentProduct.oldPrice) {
        priceHTML += `
            <span class="old-price">
                ${formatPrice(currentProduct.oldPrice)}
            </span>
        `;
    }

    document.getElementById("productPrice").innerHTML =
        priceHTML;


    document.getElementById("productDescription").textContent =
        currentProduct.description ||
        "حوله‌ای باکیفیت، نرم و لطیف، مناسب استفاده روزمره و هدیه.";


    const categories = {
        bath: "حوله حمام",
        hand: "حوله دست و صورت",
        pool: "حوله استخری",
        set: "ست حوله"
    };

    document.getElementById("productCategory").textContent =
        categories[currentProduct.category] || "حوله";


    const uses = {
        bath: "حمام و استفاده روزمره",
        hand: "دست و صورت",
        pool: "استخر و سفر",
        set: "استفاده خانوادگی"
    };

    document.getElementById("productUse").textContent =
        uses[currentProduct.category] || "استفاده روزمره";


    loadSimilarProducts();

}


function changeQuantity(amount) {

    const input = document.getElementById("quantity");

    let value = Number(input.value) + amount;

    if (value < 1) value = 1;

    input.value = value;
}


function addCurrentProduct() {

    if (!currentProduct) return;

    const quantity =
        Number(document.getElementById("quantity").value) || 1;


    let cart =
        JSON.parse(localStorage.getItem("navidTowelCart")) || [];


    const existing =
        cart.find(item => item.id === currentProduct.id);


    if (existing) {

        existing.quantity += quantity;

    } else {

        cart.push({
            ...currentProduct,
            quantity: quantity
        });

    }


    localStorage.setItem(
        "navidTowelCart",
        JSON.stringify(cart)
    );


    alert("محصول به سبد خرید اضافه شد 🛒");
}


function loadSimilarProducts() {

    const container =
        document.getElementById("similarProducts");


    const similar =
        products
            .filter(product => product.id !== currentProduct.id)
            .slice(0, 4);


    container.innerHTML = similar.map(product => `

        <div
            class="similar-card"
            onclick="window.location.href='product.html?id=${product.id}'">

            <img
                src="${product.image}"
                alt="${product.name}">

            <div class="similar-card-content">

                <h3>${product.name}</h3>

                <div class="similar-price">
                    ${formatPrice(product.price)}
                </div>

            </div>

        </div>

    `).join("");
}


loadProduct();

</script>

</body>
</html>
