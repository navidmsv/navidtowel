<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فروشگاه | NavidTowel</title>

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --green: #34452f;
            --green-dark: #263522;
            --cream: #f7f3eb;
            --white: #ffffff;
            --text: #252525;
            --muted: #777;
            --border: #e8e4dc;
            --danger: #a33b32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .shop-header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .shop-header-inner {
            max-width: 1200px;
            height: 76px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .shop-logo {
            font-size: 25px;
            font-weight: 900;
            color: var(--green);
            white-space: nowrap;
        }

        .shop-nav {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-right: auto;
        }

        .shop-nav a {
            font-size: 15px;
            color: #444;
            transition: .2s;
        }

        .shop-nav a:hover,
        .shop-nav a.active {
            color: var(--green);
            font-weight: 700;
        }

        .header-cart {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-weight: 700;
            white-space: nowrap;
        }

        .cart-count {
            min-width: 23px;
            height: 23px;
            padding: 0 6px;
            border-radius: 50px;
            background: var(--green);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .mobile-header {
            display: none;
        }

        /* =========================
           MOBILE MENU
        ========================= */

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            opacity: 0;
            visibility: hidden;
            transition: .25s;
            z-index: 2000;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            right: -310px;
            width: 290px;
            max-width: 85%;
            height: 100%;
            background: white;
            z-index: 2100;
            padding: 25px 20px;
            transition: .3s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,.12);
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .mobile-menu-logo {
            color: var(--green);
            font-weight: 900;
            font-size: 21px;
        }

        .menu-close {
            border: 0;
            background: #f3f1ec;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .mobile-menu-links {
            display: flex;
            flex-direction: column;
        }

        .mobile-menu-links a {
            padding: 16px 5px;
            border-bottom: 1px solid #f0ede7;
            font-size: 15px;
        }

        .mobile-menu-links a.active {
            color: var(--green);
            font-weight: 800;
        }

        .menu-products-btn {
            display: block;
            margin-top: 25px;
            background: var(--green);
            color: white !important;
            text-align: center;
            padding: 14px !important;
            border-radius: 12px;
            border: 0 !important;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .shop-page {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px 130px;
        }

        .shop-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .shop-title h1 {
            margin: 0 0 8px;
            font-size: 31px;
            color: var(--green-dark);
        }

        .shop-title p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           FILTER
        ========================= */

        .category-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category-btn {
            border: 1px solid var(--border);
            background: white;
            color: #555;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: .2s;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .product-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: .25s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(45,55,40,.09);
        }

        .product-image {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #eeeae2;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .35s;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--green);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 2;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.7;
            min-height: 52px;
            cursor: pointer;
        }

        .price-area {
            min-height: 53px;
        }

        .old-price {
            display: block;
            color: #aaa;
            font-size: 12px;
            text-decoration: line-through;
            margin-bottom: 3px;
        }

        .product-price {
            color: var(--green-dark);
            font-size: 16px;
            font-weight: 900;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .add-btn {
            flex: 1;
            border: 0;
            background: var(--green);
            color: white;
            border-radius: 11px;
            padding: 12px 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: .2s;
        }

        .add-btn:hover {
            background: var(--green-dark);
        }

        .view-btn {
            width: 44px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 11px;
            cursor: pointer;
            font-size: 18px;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            background: white;
            border-radius: 18px;
        }

        /* =========================
           BOTTOM CART
        ========================= */

        .bottom-cart {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(650px, calc(100% - 30px));
            background: white;
            border: 1px solid var(--border);
            box-shadow: 0 10px 35px rgba(0,0,0,.14);
            border-radius: 18px;
            padding: 12px 15px;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .bottom-cart-info {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .bottom-cart-icon {
            width: 43px;
            height: 43px;
            background: var(--green);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bottom-cart-text small {
            display: block;
            color: #888;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .bottom-cart-total {
            font-weight: 900;
            color: var(--green-dark);
            font-size: 16px;
            white-space: nowrap;
        }

        .bottom-cart-btn {
            background: var(--green);
            color: white;
            border: 0;
            border-radius: 12px;
            padding: 13px 22px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        .bottom-cart-btn:hover {
            background: var(--green-dark);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 105px;
            transform: translate(-50%, 20px);
            background: var(--green-dark);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            opacity: 0;
            visibility: hidden;
            transition: .25s;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 850px) {

            .shop-header {
                display: none;
            }

            .mobile-header {
                display: flex;
                position: sticky;
                top: 0;
                z-index: 1000;
                height: 64px;
                background: white;
                border-bottom: 1px solid var(--border);
                align-items: center;
                justify-content: space-between;
                padding: 0 15px;
            }

            .mobile-header-btn {
                width: 42px;
                height: 42px;
                border: 0;
                background: #f3f1ec;
                border-radius: 12px;
                cursor: pointer;
                font-size: 20px;
                color: var(--green);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .mobile-logo {
                color: var(--green);
                font-size: 21px;
                font-weight: 900;
            }

            .mobile-cart {
                position: relative;
            }

            .mobile-cart-count {
                position: absolute;
                top: -5px;
                right: -5px;
                min-width: 19px;
                height: 19px;
                padding: 0 4px;
                background: var(--green);
                color: white;
                border-radius: 50px;
                font-size: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .shop-page {
                padding-top: 25px;
            }

            .shop-title h1 {
                font-size: 25px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 13px;
            }

            .product-card {
                border-radius: 14px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 14px;
                min-height: 48px;
                margin-bottom: 8px;
            }

            .product-price {
                font-size: 14px;
            }

            .old-price {
                font-size: 10px;
            }

            .product-actions {
                margin-top: 10px;
            }

            .add-btn {
                padding: 10px 5px;
                font-size: 12px;
            }

            .view-btn {
                width: 40px;
            }

            .category-bar {
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 5px;
                margin-bottom: 22px;
            }

            .category-btn {
                white-space: nowrap;
                flex-shrink: 0;
                padding: 9px 16px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {

            .shop-page {
                padding-left: 12px;
                padding-right: 12px;
                padding-bottom: 120px;
            }

            .shop-title {
                margin-bottom: 20px;
            }

            .shop-title h1 {
                font-size: 23px;
            }

            .shop-title p {
                font-size: 12px;
            }

            .products-grid {
                gap: 10px;
            }

            .product-badge {
                top: 8px;
                right: 8px;
                padding: 5px 8px;
                font-size: 9px;
            }

            .product-info {
                padding: 10px;
            }

            .product-name {
                font-size: 13px;
                line-height: 1.6;
            }

            .product-price {
                font-size: 13px;
            }

            .bottom-cart {
                bottom: 10px;
                width: calc(100% - 20px);
                padding: 10px;
                border-radius: 15px;
            }

            .bottom-cart-icon {
                width: 39px;
                height: 39px;
                font-size: 18px;
            }

            .bottom-cart-total {
                font-size: 14px;
            }

            .bottom-cart-btn {
                padding: 11px 15px;
                font-size: 12px;
            }

            .bottom-cart-text small {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     DESKTOP HEADER
========================= -->

<header class="shop-header">
    <div class="shop-header-inner">

        <a href="index.html" class="shop-logo">
            NavidTowel
        </a>

        <nav class="shop-nav">
            <a href="index.html">خانه</a>
            <a href="shop.html" class="active">فروشگاه</a>
            <a href="#">دسته‌بندی‌ها</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </nav>

        <a href="cart.html" class="header-cart">
            🛒
            <span>سبد خرید</span>
            <span class="cart-count" id="desktopCartCount">0</span>
        </a>

    </div>
</header>


<!-- =========================
     MOBILE HEADER
========================= -->

<header class="mobile-header">

    <button
        class="mobile-header-btn"
        id="menuBtn"
        aria-label="باز کردن منو">
        ☰
    </button>

    <a href="index.html" class="mobile-logo">
        NavidTowel
    </a>

    <a href="cart.html"
       class="mobile-header-btn mobile-cart"
       aria-label="سبد خرید">
        🛒
        <span class="mobile-cart-count" id="mobileCartCount">0</span>
    </a>

</header>


<!-- =========================
     MOBILE MENU
========================= -->

<div class="menu-overlay" id="menuOverlay"></div>

<aside class="mobile-menu" id="mobileMenu">

    <div class="mobile-menu-head">

        <div class="mobile-menu-logo">
            NavidTowel
        </div>

        <button class="menu-close" id="menuClose">
            ×
        </button>

    </div>

    <nav class="mobile-menu-links">

        <a href="index.html">
            خانه
        </a>

        <a href="shop.html" class="active">
            فروشگاه
        </a>

        <a href="#">
            دسته‌بندی‌ها
        </a>

        <a href="#">
            درباره ما
        </a>

        <a href="#">
            تماس با ما
        </a>

        <a href="cart.html">
            سبد خرید
            <span id="menuCartCount">(0)</span>
        </a>

        <a href="shop.html" class="menu-products-btn">
            مشاهده محصولات
        </a>

    </nav>

</aside>


<!-- =========================
     SHOP
========================= -->

<main class="shop-page">

    <section class="shop-title">

        <h1>
            فروشگاه حوله
        </h1>

        <p>
            انتخابی از حوله‌های باکیفیت برای خانه و استفاده روزمره
        </p>

    </section>


    <!-- CATEGORY FILTER -->

    <div class="category-bar">

        <button
            class="category-btn active"
            data-category="all">
            همه محصولات
        </button>

        <button
            class="category-btn"
            data-category="bath">
            حوله حمام
        </button>

        <button
            class="category-btn"
            data-category="hand">
            دست و صورت
        </button>

        <button
            class="category-btn"
            data-category="pool">
            استخری
        </button>

        <button
            class="category-btn"
            data-category="set">
            ست حوله
        </button>

    </div>


    <!-- PRODUCTS -->

    <section
        class="products-grid"
        id="productsGrid">
    </section>

</main>


<!-- =========================
     BOTTOM CART
========================= -->

<div class="bottom-cart">

    <div class="bottom-cart-info">

        <div class="bottom-cart-icon">
            🛒
        </div>

        <div class="bottom-cart-text">

            <small>
                مبلغ قابل پرداخت
            </small>

            <div
                class="bottom-cart-total"
                id="bottomCartTotal">
                0 تومان
            </div>

        </div>

    </div>

    <button
        class="bottom-cart-btn"
        onclick="goToCart()">
        ادامه سفارش
    </button>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
    محصول به سبد خرید اضافه شد
</div>


<script src="products.js"></script>

<script>

    /* =========================
       CART
    ========================= */

    let cart =
        JSON.parse(
            localStorage.getItem("navidTowelCart")
        ) || [];


    /* =========================
       PRICE
    ========================= */

    function formatPrice(value) {

        return Number(value)
            .toLocaleString("en-US")
            + " تومان";

    }


    /* =========================
       CART COUNT
    ========================= */

    function getCartCount() {

        return cart.reduce(
            (total, item) =>
                total + Number(item.quantity || 0),
            0
        );

    }


    function updateCartUI() {

        const count = getCartCount();

        document.getElementById(
            "desktopCartCount"
        ).textContent = count;

        document.getElementById(
            "mobileCartCount"
        ).textContent = count;

        document.getElementById(
            "menuCartCount"
        ).textContent = "(" + count + ")";


        const total = cart.reduce(
            (sum, item) => {

                return sum +
                    (Number(item.price) *
                     Number(item.quantity || 0));

            },
            0
        );


        document.getElementById(
            "bottomCartTotal"
        ).textContent = formatPrice(total);

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart(id) {

        const product =
            products.find(
                item => Number(item.id) === Number(id)
            );

        if (!product) return;


        const existing =
            cart.find(
                item => Number(item.id) === Number(id)
            );


        if (existing) {

            existing.quantity =
                Number(existing.quantity || 0) + 1;

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: product.price,

                quantity: 1

            });

        }


        localStorage.setItem(
            "navidTowelCart",
            JSON.stringify(cart)
        );


        updateCartUI();

        showToast();

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(category = "all") {

        const grid =
            document.getElementById(
                "productsGrid"
            );


        let filteredProducts =
            products;


        if (category !== "all") {

            filteredProducts =
                products.filter(
                    product =>
                        product.category === category
                );

        }


        if (!filteredProducts.length) {

            grid.innerHTML = `
                <div class="empty-products">
                    محصولی در این دسته‌بندی پیدا نشد.
                </div>
            `;

            return;
        }


        grid.innerHTML =
            filteredProducts.map(product => {

                const hasOldPrice =
                    product.oldPrice &&
                    Number(product.oldPrice) >
                    Number(product.price);


                return `

                    <article class="product-card">

                        <div
                            class="product-image"
                            onclick="openProduct(${product.id})">

                            ${
                                product.badge
                                ?
                                `<span class="product-badge">
                                    ${product.badge}
                                </span>`
                                :
                                ""
                            }

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                loading="lazy"
                                onerror="this.style.display='none'">

                        </div>


                        <div class="product-info">

                            <div
                                class="product-name"
                                onclick="openProduct(${product.id})">

                                ${product.name}

                            </div>


                            <div class="price-area">

                                ${
                                    hasOldPrice
                                    ?
                                    `
                                    <span class="old-price">
                                        ${formatPrice(product.oldPrice)}
                                    </span>
                                    `
                                    :
                                    ""
                                }

                                <div class="product-price">
                                    ${formatPrice(product.price)}
                                </div>

                            </div>


                            <div class="product-actions">

                                <button
                                    class="add-btn"
                                    onclick="addToCart(${product.id})">

                                    افزودن به سبد

                                </button>


                                <button
                                    class="view-btn"
                                    onclick="openProduct(${product.id})"
                                    aria-label="مشاهده محصول">

                                    👁

                                </button>

                            </div>

                        </div>

                    </article>

                `;

            }).join("");

    }


    /* =========================
       PRODUCT PAGE
    ========================= */

    function openProduct(id) {

        window.location.href =
            "product.html?id=" + id;

    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;


    function showToast() {

        const toast =
            document.getElementById("toast");


        toast.classList.add("show");


        clearTimeout(toastTimer);


        toastTimer =
            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

    }


    /* =========================
       GO CART
    ========================= */

    function goToCart() {

        window.location.href =
            "cart.html";

    }


    /* =========================
       CATEGORY BUTTONS
    ========================= */

    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(".category-btn")
                        .forEach(btn =>
                            btn.classList.remove("active")
                        );


                    this.classList.add("active");


                    renderProducts(
                        this.dataset.category
                    );

                }
            );

        });


    /* =========================
       MOBILE MENU
    ========================= */

    const menuBtn =
        document.getElementById("menuBtn");

    const menuClose =
        document.getElementById("menuClose");

    const menuOverlay =
        document.getElementById("menuOverlay");

    const mobileMenu =
        document.getElementById("mobileMenu");


    function openMenu() {

        mobileMenu.classList.add("active");

        menuOverlay.classList.add("active");

        document.body.style.overflow =
            "hidden";

    }


    function closeMenu() {

        mobileMenu.classList.remove("active");

        menuOverlay.classList.remove("active");

        document.body.style.overflow =
            "";

    }


    menuBtn.addEventListener(
        "click",
        openMenu
    );


    menuClose.addEventListener(
        "click",
        closeMenu
    );


    menuOverlay.addEventListener(
        "click",
        closeMenu
    );


    document
        .querySelectorAll(".mobile-menu-links a")
        .forEach(link => {

            link.addEventListener(
                "click",
                closeMenu
            );

        });


    /* =========================
       INITIAL LOAD
    ========================= */

    renderProducts();

    updateCartUI();

</script>

</body>
</html>
